version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - env | grep -E '^(CONTENT_SOURCE|DYNAMODB_CONTENT_TABLE|DDB_REGION|S3_MEDIA_BUCKET|S3_REGION|AUTH_SECRET|NEXT_PUBLIC_|APP_AWS_)' >> .env.production || true
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
